spring.application.name=gymweb
server.port=8080

# =======================
#   MYSQL CONFIG
# =======================
spring.datasource.url=jdbc:mysql://localhost:3306/gymweb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.username=root
spring.datasource.password=aguspro98
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =======================
#   JPA / HIBERNATE
# =======================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# =======================
#   SPRING MVC
# =======================
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# =======================
#   CORS
# =======================
spring.web.cors.allowed-origins=http://localhost:4200
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# =======================
#   LOGGING
# =======================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.example.gymweb=INFO

# =======================
#   JWT
# =======================
jwt.secret=${JWT_SECRET:change-me-please-32-characters-key!!}

# =======================
#   MERCADO PAGO (test)
# =======================
# Usa variables de entorno para PROD. Los valores locales siguen apuntando a localhost para desarrollo.
# Ejemplos:
#   MERCADOPAGO_BACK_URL=https://tu-dominio.com/membresias
#   MERCADOPAGO_NOTIFICATION_URL=https://tu-dominio.com/api/pagos/mercadopago/confirmar
#   MERCADOPAGO_WEBHOOK_SECRET=<<secret de "Tus integraciones">>
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:APP_USR-1453757200907269-022714-d18f98ed7ef527afc8a29bb18470a17f-2125939316}
mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY:APP_USR-e8d058c7-1337-40a4-bef1-cb584be51f19}
mercadopago.back-url=${MERCADOPAGO_BACK_URL:http://localhost:4200/membresias}
mercadopago.notification-url=${MERCADOPAGO_NOTIFICATION_URL:http://localhost:8080/api/pagos/mercadopago/confirmar}
# auto_return solo se enviará si back-url es https
mercadopago.auto-return=${MERCADOPAGO_AUTO_RETURN:approved}
# Secreto para validar x-signature de webhooks (opcional en local)
mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
